<section class="km-section" id="kc901-sec-1" aria-labelledby="kc901-sec-1-heading"><h2 id="kc901-sec-1-heading" data-km-source="12">1. Command Format and Description</h2>
<p data-km-source="13">Both host commands and instrument responses use packets as their basic data unit. A packet starts with "$".</p>
<p data-km-source="14">A packet ends with the newline character "\n". Elements within a packet are separated by ASCII commas ",", as described below.</p></section>
