<section class="km-section" id="kc901-sec-3-4" aria-labelledby="kc901-sec-3-4-heading"><h3 id="kc901-sec-3-4-heading" data-km-source="3524">3.4 Instrument Messages</h3>
<p data-km-source="3525">Unsolicited instrument messages generally provide warnings or notifications. Each warning is a separate packet. Host software can identify the error type from the packet header without matching the message text. The messages are described below.</p></section>
