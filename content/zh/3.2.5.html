<section class="km-section" id="kc901-sec-3-2-5-zh" aria-labelledby="kc901-sec-3-2-5-heading-zh"><h4 id="kc901-sec-3-2-5-heading-zh" data-km-source="157">3.2.5设置输出衰减</h4>
<div class="km-table-wrap" tabindex="0" role="region" aria-label="3.2.5设置输出衰减 参数表"><table>
<caption>3.2.5设置输出衰减 — 参数表</caption>
<tbody>
<tr>
<th scope="col"><p data-km-source="158">命令</p></th>
<th scope="col"><p data-km-source="159">选项</p></th>
<th scope="col"><p data-km-source="160">说明</p></th>
</tr>
<tr>
<td><p data-km-source="161">outAtt</p></td>
<td><p data-km-source="162">无</p></td>
<td>
<p data-km-source="163">参数取值范围：</p>
<p data-km-source="164">KC901K、J、R :-30~30</p>
<p data-km-source="165">KC901V/RFMA  : 0~25</p>
<p data-km-source="166">KC901S+ :0~20</p>
<p data-km-source="167">单位：dB</p>
<p data-km-source="168">此输出衰减在以下模式中生效：</p>
<p data-km-source="169">S11（反射），</p>
<p data-km-source="170">S21（传输）,</p>
<p data-km-source="171">S22（反射）,（仅第四代KC901X支持）</p>
<p data-km-source="172">S12 (传输) ,（仅第四代KC901X支持）</p>
<p data-km-source="173">DTF（故障定位）,</p>
</td>
</tr>
</tbody>
</table></div>
<p data-km-source="174">说明：第四代901设置后输出幅度为源增益模式；</p>
<p data-km-source="175">例程：</p>
<p data-km-source="176">输出衰减器置10dB衰减</p>
<pre class="km-code"><code><span class="km-code-line tx" data-km-source="177">$outAtt,10\n</span></code></pre>
</section>
