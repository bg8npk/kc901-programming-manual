<section class="km-section" id="kc901-sec-2-3-1-zh" aria-labelledby="kc901-sec-2-3-1-heading-zh"><h4 id="kc901-sec-2-3-1-heading-zh" data-km-source="57">2.3.1、打开网络功能</h4>
<p data-km-source="58">在进行网络连接前，应将“系统设置”（Settings，按FUNC键进入）界面下的“网络”（Network）子菜单调整为“开”（ON）状态（第4代KC901没有这项设置，插上网线自动开启）。网络功能开启后，网络接口上的黄灯点亮。由于网络连接会消耗较多电力，在不使用网络时，应当将网络功能关闭（第4代KC901不能手动关闭网口电源，拔掉网线网口自动休眠）。</p></section>
