<section class="km-section" id="kc901-sec-2-4-zh" aria-labelledby="kc901-sec-2-4-heading-zh"><h3 id="kc901-sec-2-4-heading-zh" data-km-source="68">2.4与KC901握手</h3>
<p data-km-source="69">注意：请确保当前KC901没有窗口显示（比如“关于本机”），若在KC901显示窗口下进行握手，KC901会返回警告字符串(第4代KC901可以在有窗口显示的情况下进行握手不会返回警告信息)：</p>
<pre class="km-code"><code><span class="km-code-line rx" data-km-source="70">$start,ConFail\n</span>
<span class="km-code-line rx" data-km-source="71">$Please exit the window operation first.\n</span>
<span class="km-code-line rx" data-km-source="72">$end\n</span></code></pre>
<p data-km-source="73">此时请先退出窗口显示，再进行握手操作。</p>
<p data-km-source="74">申请控制</p>
<p data-km-source="75">发送大写的C</p>
<p data-km-source="76">等待大约1秒时间，返回[KC901]及其序列号。此时KC901进入远动模式。</p></section>
