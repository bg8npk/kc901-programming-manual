<section class="km-section" id="kc901-sec-3-2-23-zh" aria-labelledby="kc901-sec-3-2-23-heading-zh"><h4 id="kc901-sec-3-2-23-heading-zh" data-km-source="470">3.2.23恢复出厂设置</h4>
<div class="km-table-wrap" tabindex="0" role="region" aria-label="3.2.23恢复出厂设置 参数表"><table>
<caption>3.2.23恢复出厂设置 — 参数表</caption>
<tbody>
<tr>
<th scope="col"><p data-km-source="471">发送命令</p></th>
<th scope="col"><p data-km-source="472">选项</p></th>
<th scope="col"><p data-km-source="473">说明</p></th>
</tr>
<tr>
<td><p data-km-source="474">reset</p></td>
<td><p data-km-source="475">无</p></td>
<td><p data-km-source="476">恢复所有设置并替换系统校准为出厂校准</p></td>
</tr>
</tbody>
</table></div>
<p data-km-source="477">例程：</p>
<pre class="km-code"><code><span class="km-code-line tx" data-km-source="478">$reset\n</span></code></pre>
<p data-km-source="479">注意:</p>
<p data-km-source="480">恢复到出厂设置后，网络配置参数也会是出厂设置，可能需要重新配置。</p>
