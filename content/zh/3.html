<section class="km-section" id="kc901-sec-3-zh" aria-labelledby="kc901-sec-3-heading-zh"><h2 id="kc901-sec-3-heading-zh" data-km-source="87">3.指令说明</h2>
<p data-km-source="88">下面将对KC901的所有指令进行详细说明，并给出实际运行例程。对于例程的格式，需要注意的是：</p>
<p data-km-source="89">1、紫色代表上位机发送，蓝色代表下位机返回。</p>
<p data-km-source="90">2、发送和返回都会明确标明回车符“\n”，实际返回看不见的。</p>
<p data-km-source="91">3、注意指令与选项及参数之间都需要逗号做分隔。</p>
<p data-km-source="92">4、使用分号“;”及同行后的内容为注释，并不属于实际格式。</p></section>
