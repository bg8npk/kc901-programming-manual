<section class="km-section" id="kc901-sec-1-3-zh" aria-labelledby="kc901-sec-1-3-heading-zh"><h3 id="kc901-sec-1-3-heading-zh" data-km-source="22">1.3格式说明</h3>
<p data-km-source="23">1、不是每个命令都必须包括选项和参数，请按照指令表的规定使用。</p>
<p data-km-source="24">2、双括号[]仅仅是本手册为了方便表达而添加，实际不用输入。</p>
<p data-km-source="25">3、除专门说明外，字母大小写的意义相同。</p>
<p data-km-source="26">4、如果输入的指令内容有错误，KC901会在发现错误之后，立刻返回错误提示，并且丢弃此错误包。</p>
<p data-km-source="27">5、如果输入的指令格式有错误，KC901会丢弃掉所有错误格式，仅提取其中的正确格式。</p></section>
