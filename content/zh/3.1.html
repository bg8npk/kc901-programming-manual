<section class="km-section" id="kc901-sec-3-1-zh" aria-labelledby="kc901-sec-3-1-heading-zh"><h3 id="kc901-sec-3-1-heading-zh" data-km-source="93">3.1指令的分类</h3>
<p data-km-source="94">指令可以归类为以下3类：</p>
<p data-km-source="95">系统设置指令</p>
<p data-km-source="96">属于下行指令，例如设置液晶亮度、发射机输出衰减。</p>
<p data-km-source="97">测量控制指令</p>
<p data-km-source="98">属于下行指令，例如使用S11模式测量对应频率点的S参数。</p>
<p data-km-source="99">警告</p>
<p data-km-source="100">属于上行指令，例如过载警告、高温警告。</p></section>
