<section class="km-section" id="kc901-sec-1-2-zh" aria-labelledby="kc901-sec-1-2-heading-zh"><h3 id="kc901-sec-1-2-heading-zh" data-km-source="17">1.2返回数据格式</h3>
<p data-km-source="18">返回数据为便于上位机识别，其格式与发送格式略有不同，为了便于说明，分号“;”及其同一行后的内容代表注释：</p>
<pre class="km-code"><code><span class="km-code-line " data-km-source="19">$start,[包名称]\n  ;每行以“$”开头“\n”结尾。“start”代表起始</span>
<span class="km-code-line " data-km-source="20">$[包内容]\n        ;包内容元素之间以逗号“,”分隔</span>
<span class="km-code-line " data-km-source="21">$end\n             ;“end”代表包结束</span></code></pre></section>
