<section class="km-section" id="kc901-sec-1-4-zh" aria-labelledby="kc901-sec-1-4-heading-zh"><h3 id="kc901-sec-1-4-heading-zh" data-km-source="28">1.4通信例程</h3>
<p data-km-source="29">如果需要获取系统时间，应发送如下命令：</p>
<pre class="km-code"><code><span class="km-code-line " data-km-source="30">$[命令],[选项]\n</span>
<span class="km-code-line " data-km-source="31">$date,get\n</span></code></pre>
<p data-km-source="32">下面展示整个过程，紫色代表上位机发送，蓝色代表下位机返回。</p>
<pre class="km-code"><code><span class="km-code-line tx" data-km-source="33">$date,get\n</span>
<span class="km-code-line rx" data-km-source="34">$start,date\n</span>
<span class="km-code-line rx" data-km-source="35">Date:2025-12-30 15:22:14  ;依次代表年月日时分秒</span>
<span class="km-code-line rx" data-km-source="36">$end\n</span></code></pre></section>
