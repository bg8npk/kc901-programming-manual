<section class="km-section" id="kc901-sec-2-5-zh" aria-labelledby="kc901-sec-2-5-heading-zh"><h3 id="kc901-sec-2-5-heading-zh" data-km-source="77">2.5与KC901断开</h3>
<p data-km-source="78">断开方式有两种：</p>
<p data-km-source="79">1、上位机发送命令断开，详见：3.2.19 退出远程控制模式。</p>
<p data-km-source="80">2、在901上按下[SHIFT]+[MODE]按键主动断开。</p>
<p data-km-source="81">如果在通信中意外拔出USB插头或者因其它原因中断通信，901不会自动识别，仍需通过[SHIFT]+[MODE]按键来终止。(第4代KC901断开按键为[SHIFT]+[HOME])</p></section>
