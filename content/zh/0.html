<section class="km-section" id="kc901-sec-0-zh" aria-labelledby="kc901-sec-0-heading-zh"><h2 id="kc901-sec-0-heading-zh" data-km-source="8">0、概述</h2>
<p data-km-source="9">KC901采用文本命令方式进行数据通信，即俗称的ASCII命令。数据通过USB端口或网口进行物理连接，在KC901内部被转换为串行数据，供CPU识别。用户可以用命令行方式直接操作KC901，也可以另外编写应用软件，使之采用本手册规定的指令与仪器通信。</p>
<p data-km-source="10">目前KC901的操作指令是未分级的描述语言，简单易懂，不需学习协议逻辑知识即可迅速掌握。</p>
<p data-km-source="11">在本手册中，“上位机”是指用于操控KC901的PC机或其它控制装置。“下位机”是指KC901。</p></section>
