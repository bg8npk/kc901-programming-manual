<section class="km-section" id="kc901-sec-1-5-zh" aria-labelledby="kc901-sec-1-5-heading-zh"><h2 id="kc901-sec-1-5-heading-zh" data-km-source="37">1.5、通信参数</h2>
<p data-km-source="38">波特率：921600（第三代KC901X）</p>
<p data-km-source="39">波特率：460800（第四代KC901X）</p>
<p data-km-source="40">数据位：8位</p>
<p data-km-source="41">停止位：1位</p>
<p data-km-source="42">无校验。</p>
<p data-km-source="43">指令缓存：32kb。进入缓存的指令顺序执行，存满时不再接收新的指令。编程时应考虑到执行的速度，避免拥堵。</p>
<p data-km-source="44">数据缓存：32kb。进入缓存的数据顺序发出，缓存满时中止执行。</p>
<p data-km-source="45">通过远程操作获取的测量数据未严格修约，需要自行取舍有效位数。</p></section>
