<section class="km-section" id="kc901-sec-4-zh" aria-labelledby="kc901-sec-4-heading-zh"><h2 id="kc901-sec-4-heading-zh" data-km-source="3599">4、版本说明</h2>
<p data-km-source="3600">本手册适用于版本在V1.5.6(KC901V/M) ，1.2.9(KC901C+/S+) ，1.2.1(KC901Q)，V1.5.6（KC901J/K/R/T）及以上的固件。低于该版本的固件，请参阅旧版手册。</p>
<p data-km-source="3601">本手册未特别指明不同型号设备的功能区别。如果设备不具备某项功能，则相应的指令无效。例如KC901V不具备S22测试功能和全双端口校准功能，故关于这两种功能的任意组合都属于无效命令。</p>
<p data-km-source="3602">[结束]</p></section>
