<section class="km-section" id="kc901-sec-2-1-zh" aria-labelledby="kc901-sec-2-1-heading-zh"><h3 id="kc901-sec-2-1-heading-zh" data-km-source="47">2.1安装USB驱动</h3>
<p data-km-source="48">如果采用USB口连接，应安装USB驱动。WINDOWS操作系统通常自带驱动程序，只需将KC901的USB接口与PC机连接，系统即可自动安装驱动。如果系统未能正确安装，可以手动下载驱动程序进行安装。</p>
<p data-km-source="49">下载链接：<a href="http://www.ftdichip.com/Drivers/VCP.htm">http://www.ftdichip.com/Drivers/VCP.htm</a></p>
<p data-km-source="50">如果采用网口连接，不需要安装专门的驱动。</p></section>
